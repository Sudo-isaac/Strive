<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Park Pass</title>

<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>

<style>
.card {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #3a3a55;
  padding: 15px;
  border-radius: 15px;
  margin-top: 15px;
}

.card:hover {
  transform: scale(1.02);
  transition: 0.2s;
}

.qr {
  width: 120px;
  border-radius: 10px;
  background: white;
  padding: 5px;
}

.info {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.profile {
  width: 70px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="box" id="authBox">

  <!-- SIGNUP -->
  <div id="signupForm">
    <h2>Create Account 🚴</h2>
    <input id="signupEmail" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">
    <input id="signupName" placeholder="Full Name">
    <input id="signupDob" type="date">
    <input id="signupPhoto" type="file">
    <button onclick="signup()">Sign Up</button>
  </div>

  <!-- LOGIN -->
  <div id="loginForm" style="display:none;">
    <h2>Login 🔐</h2>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div class="switch" onclick="toggle()">
    Switch Login / Signup
  </div>

</div>

<!-- DASHBOARD -->
<div class="box" id="dashboard" style="display:none;">
  <h2>Your Bike Park Pass 🎫</h2>

  <div class="card">
    <img id="qr" class="qr">

    <div class="info">
      <h3 id="userName"></h3>
      <p id="userDob"></p>
      <img id="userPhoto" class="profile">
    </div>
  </div>
</div>

</body>
</html>
