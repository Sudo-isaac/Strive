<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bike Park Pass</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #1e1e2f;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.card {
  background: #3a3a55;
  padding: 25px;
  border-radius: 18px;
  text-align: center;
  width: 320px;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}
h2 { margin-bottom: 10px; }
p { margin-bottom: 20px; color: #d0d0d0; }
img {
  width: 140px;
  height: 140px;
  object-fit: cover;
  border-radius: 12px;
  border: 3px solid white;
}
.error { text-align: center; color: white; font-size: 24px; }
.loading { text-align: center; color: white; font-size: 20px; }
</style>
</head>
<body>
<div class="loading" id="loading">Loading Pass...</div>
<div class="card" id="card" style="display:none;">
  <h2 id="name">Loading...</h2>
  <p id="age">Age: --</p>
  <img id="photo" src="" alt="User Photo"/>
</div>

<script type="module">
  // ✅ All imports from the SAME version
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // 🔧 Replace with your actual Firebase config
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function calculateAge(dob) {
    if (!dob) throw new Error("No DOB");
    // Handle Firestore Timestamp or plain string
    const birth = dob.toDate ? dob.toDate() : new Date(dob);
    const now = new Date();
    let age = now.getFullYear() - birth.getFullYear();
    const m = now.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
    return age;
  }

  const params = new URLSearchParams(window.location.search);
  const uid = params.get("uid");
  const loading = document.getElementById("loading");
  const card = document.getElementById("card");

  async function loadUser() {
    if (!uid) {
      document.body.innerHTML = `<div class="error">Invalid QR Code</div>`;
      return;
    }
    try {
      const snap = await getDoc(doc(db, "users", uid));
      if (!snap.exists()) {
        document.body.innerHTML = `<div class="error">User Not Found</div>`;
        return;
      }
      const user = snap.data();
      document.getElementById("name").innerText = user.name || "Unknown User";
      try {
        document.getElementById("age").innerText = "Age: " + calculateAge(user.dob);
      } catch {
        document.getElementById("age").innerText = "Age: Unknown";
      }
      document.getElementById("photo").src = user.photoURL || "https://placehold.co/140x140";
      loading.style.display = "none";
      card.style.display = "block";
    } catch (error) {
      console.error("Error loading user:", error);
      document.body.innerHTML = `<div class="error">Error Loading Pass</div>`;
    }
  }

  loadUser();
</script>
</body>
</html>
